services:
  workspace:
    build:
      context: ./workspace
    command: sleep infinity
    depends_on:
      - squid
      - web
      - curl
    networks:
      - app-net

  curl:
    build:
      context: ./curl
    command: sleep infinity
    depends_on:
      - squid
    environment:
      http_proxy: http://squid:3128
      https_proxy: http://squid:3128
      HTTP_PROXY: http://squid:3128
      HTTPS_PROXY: http://squid:3128
      no_proxy: localhost,127.0.0.1,squid,web
      NO_PROXY: localhost,127.0.0.1,squid,web
    networks:
      - app-net

  squid:
    build:
      context: ./squid
    ports:
      - "3128:3128"
    networks:
      - app-net
      - proxy-egress

  web:
    build:
      context: ./web
    networks:
      - app-net

networks:
  app-net:
    internal: true
  proxy-egress:
