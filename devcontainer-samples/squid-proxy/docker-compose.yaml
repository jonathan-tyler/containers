services:
  workspace:
    build:
      context: ./workspace
    command: sleep infinity
    depends_on:
      - squid
    networks:
      - app-net

  squid:
    build:
      context: ./squid
    ports:
      - "3128:3128"
    networks:
      - app-net
      - proxy-egress

networks:
  app-net:
    internal: true
  proxy-egress:
