[containers]
# The smoke-test workload does not need cgroup management.
cgroups = "disabled"

[engine]
# Systemd is not running inside the outer development container.
cgroup_manager = "cgroupfs"
events_logger = "file"
# Buildah 1.44+ stages build contexts through an overlay mount. Keep that
# temporary scaffolding on the outer container's tmpfs instead of its overlay
# root filesystem, where rootless-in-rootless mounts are rejected.
image_copy_tmp_dir = "/dev/shm/nested-podman-build"
runtime = "crun"
