name: CI - Test devcontainer features

on:
  push:
    branches:
      - main
    paths:
      - devcontainer-features/**
      - test/**
      - .github/workflows/test.yaml
  pull_request:
    paths:
      - devcontainer-features/**
      - test/**
      - .github/workflows/test.yaml
  workflow_dispatch:

jobs:
  test-autogenerated:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - utils-core
          - utils-agent
          - utils-ops
          - utils-human
          - podman-outside-of-podman
          - podman-in-podman
          - devcontainer-cli
          - opencode-server
          - opencode-tui
    env:
      XDG_RUNTIME_DIR: /tmp/xdg
    steps:
      - uses: actions/checkout@v4

      - name: Prepare feature test layout
        run: |
          ln -sfn devcontainer-features src
          perl -0pi -e 's#"ghcr.io/jonathan-tyler/containers/utils-core:0"#"./devcontainer-features/utils-core"#g; s#"ghcr.io/jonathan-tyler/containers/podman-outside-of-podman:0"#"./devcontainer-features/podman-outside-of-podman"#g' devcontainer-features/*/devcontainer-feature.json
          mkdir -p "$XDG_RUNTIME_DIR/podman"
          : > "$XDG_RUNTIME_DIR/podman/podman.sock"

      - name: Install latest devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Test ${{ matrix.feature }}
        run: devcontainer features test --skip-scenarios --skip-duplicated --base-image fedora:42 --remote-user root -f ${{ matrix.feature }} .
