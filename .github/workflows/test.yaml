name: CI - Test devcontainer features

on:
  push:
    branches:
      - main
    paths:
      - .devcontainer/**
      - devcontainer-features/**
      - test/**
      - .github/workflows/test.yaml
  pull_request:
    paths:
      - .devcontainer/**
      - devcontainer-features/**
      - test/**
      - .github/workflows/test.yaml
  workflow_dispatch:

jobs:
  test-scenarios:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    strategy:
      matrix:
        features:
          - homebrew-packages
    steps:
      # actions/checkout@v5
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for '${{ matrix.features }}' scenarios"
        run: |
          mkdir -p project
          rm -rf project/src project/test
          cp -a devcontainer-features project/src
          cp -a test project/test
          devcontainer features test --project-folder project --skip-autogenerated --skip-duplicated --base-image fedora:42 --remote-user root -f ${{ matrix.features }}
