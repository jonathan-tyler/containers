name: CI - Test devcontainer features

on:
  push:
    branches:
      - main
    paths:
      - .devcontainer/**
      - devcontainer-features/**
      - test/**
      - .github/workflows/test.yaml
  pull_request:
    paths:
      - .devcontainer/**
      - devcontainer-features/**
      - test/**
      - .github/workflows/test.yaml
  workflow_dispatch:

jobs:
  test-devcontainer-config:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v5
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Validate root devcontainer configuration
        run: bash test/devcontainer-config/test.sh

  test-autogenerated:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - utils-core
          - utils-agent
          - utils-ops
          - utils-human
          - podman-outside-of-podman
          - podman-in-podman
          - devcontainer-cli
          - opencode-server
          - opencode-tui
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      XDG_RUNTIME_DIR: /tmp/xdg
    steps:
      # actions/checkout@v5
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Prepare feature test layout
        run: |
          ln -sfn devcontainer-features src
          perl -0pi -e 's#"ghcr.io/jonathan-tyler/containers/utils-core:0"#"./devcontainer-features/utils-core"#g; s#"ghcr.io/jonathan-tyler/containers/podman-outside-of-podman:0"#"./devcontainer-features/podman-outside-of-podman"#g' devcontainer-features/*/devcontainer-feature.json
          mkdir -p "$XDG_RUNTIME_DIR/podman"
          : > "$XDG_RUNTIME_DIR/podman/podman.sock"

      - name: Install latest devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Test ${{ matrix.feature }}
        run: devcontainer features test --project-folder . --skip-scenarios --skip-duplicated --base-image fedora:42 --remote-user root -f ${{ matrix.feature }}

  test-podman-in-podman-scenarios:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      XDG_RUNTIME_DIR: /tmp/xdg
    steps:
      # actions/checkout@v5
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Prepare feature test layout
        run: |
          ln -sfn devcontainer-features src
          perl -0pi -e 's#"ghcr.io/jonathan-tyler/containers/utils-core:0"#"./devcontainer-features/utils-core"#g; s#"ghcr.io/jonathan-tyler/containers/podman-outside-of-podman:0"#"./devcontainer-features/podman-outside-of-podman"#g' devcontainer-features/*/devcontainer-feature.json
          mkdir -p "$XDG_RUNTIME_DIR/podman"
          : > "$XDG_RUNTIME_DIR/podman/podman.sock"

      - name: Install latest devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Test podman-in-podman 65532 scenario
        run: devcontainer features test --project-folder . --skip-autogenerated --skip-duplicated --base-image fedora:42 --remote-user root -f podman-in-podman --filter uid-65532
