name: CI - Test devcontainer features

on:
  push:
    branches:
      - main
    paths:
      - .devcontainer/**
      - devcontainer-features/**
      - test/**
      - .github/workflows/test.yaml
  pull_request:
    paths:
      - .devcontainer/**
      - devcontainer-features/**
      - test/**
      - .github/workflows/test.yaml
  workflow_dispatch:

jobs:
  test-scenarios:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    strategy:
      matrix:
        features:
          - aspire-cli
          - homebrew-packages
          - nonroot
          - podman-in-podman
    steps:
      # actions/checkout@v5
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Generating tests for '${{ matrix.features }}' scenarios"
        run: |
          mkdir -p .scratch/feature-ci/project
          rm -rf .scratch/feature-ci/project/src .scratch/feature-ci/project/test
          cp -a devcontainer-features .scratch/feature-ci/project/src
          cp -a test .scratch/feature-ci/project/test
          devcontainer features test --project-folder .scratch/feature-ci/project --skip-autogenerated --skip-duplicated --base-image registry.access.redhat.com/hi/core-runtime:latest-builder --remote-user root -f ${{ matrix.features }}

      - name: "Smoke test podman-in-podman with devcontainer CLI"
        if: matrix.features == 'podman-in-podman'
        run: test/podman-in-podman/devcontainer-cli-smoke.sh

      - name: "Verify homebrew-packages rejects numeric-only users"
        if: matrix.features == 'homebrew-packages'
        run: test/homebrew-packages/requires-named-user.sh
