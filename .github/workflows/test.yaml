name: CI - Test devcontainer features

on:
  push:
    branches:
      - main
    paths:
      - .devcontainer/**
      - devcontainer-features/**
      - test/**
      - .github/workflows/test.yaml
  pull_request:
    paths:
      - .devcontainer/**
      - devcontainer-features/**
      - test/**
      - .github/workflows/test.yaml
  workflow_dispatch:

jobs:
  test-independent-feature-scenarios:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      XDG_RUNTIME_DIR: /tmp/xdg
    steps:
      # actions/checkout@v5
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Prepare feature test layout
        run: |
          mkdir -p project
          ln -sfn ../devcontainer-features project/src
          ln -sfn ../test project/test
          mkdir -p "$XDG_RUNTIME_DIR/podman"
          : > "$XDG_RUNTIME_DIR/podman/podman.sock"

      - name: Install latest devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Test homebrew-packages scenarios
        run: devcontainer features test --project-folder project --skip-duplicated --skip-autogenerated --base-image fedora:42 --remote-user root -f homebrew-packages

  test-composed-feature-scenarios:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      XDG_RUNTIME_DIR: /tmp/xdg
    steps:
      # actions/checkout@v5
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Prepare feature test layout
        run: |
          mkdir -p project
          ln -sfn ../devcontainer-features project/src
          ln -sfn ../test project/test
          mkdir -p "$XDG_RUNTIME_DIR/podman"
          : > "$XDG_RUNTIME_DIR/podman/podman.sock"

      - name: Install latest devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Test podman-in-podman Red Hat Hardened Images scenario
        run: devcontainer features test --project-folder project --skip-autogenerated --skip-duplicated --base-image fedora:42 --remote-user root -f podman-in-podman --filter red-hat-hardened-images

      - name: Test podman-outside-of-podman autogenerated scenarios
        run: devcontainer features test --project-folder project --skip-scenarios --skip-duplicated --base-image fedora:42 --remote-user root -f podman-outside-of-podman
