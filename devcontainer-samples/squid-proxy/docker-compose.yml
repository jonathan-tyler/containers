services:
  workspace:
    build:
      context: ./workspace
    command: sleep infinity
    depends_on:
      - squid
      - web
    networks:
      - app-net

  squid:
    build:
      context: ./squid
    ports:
      - "3128:3128"
    networks:
      - app-net
      - proxy-egress

  web:
    build:
      context: ./web
    networks:
      - app-net

networks:
  app-net:
    internal: true
  proxy-egress:
