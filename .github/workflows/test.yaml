name: CI - Test devcontainer features

on:
  push:
    branches:
      - main
    paths:
      - .devcontainer/**
      - devcontainer-features/**
      - test/**
      - .github/workflows/test.yaml
  pull_request:
    paths:
      - .devcontainer/**
      - devcontainer-features/**
      - test/**
      - .github/workflows/test.yaml
  workflow_dispatch:

jobs:
  test-devcontainer-config:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v5
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Validate root devcontainer configuration
        run: bash test/devcontainer-config/test.sh

  test-fedora-dnf-repo:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v5
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Validate Fedora repo feature
        run: bash test/fedora-dnf-repo/test.sh

  test-utils-core:
    needs: test-fedora-dnf-repo
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      XDG_RUNTIME_DIR: /tmp/xdg
    steps:
      # actions/checkout@v5
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Prepare feature test layout
        run: |
          ln -sfn devcontainer-features src
          mkdir -p "$XDG_RUNTIME_DIR/podman"
          : > "$XDG_RUNTIME_DIR/podman/podman.sock"

      - name: Install latest devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Test utils-core
        run: devcontainer features test --project-folder . --skip-scenarios --skip-duplicated --base-image fedora:42 --remote-user root -f utils-core

  test-utils-core-dependents:
    needs: test-utils-core
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - utils-agent
          - utils-ops
          - utils-human
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      XDG_RUNTIME_DIR: /tmp/xdg
    steps:
      # actions/checkout@v5
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Prepare feature test layout
        run: |
          ln -sfn devcontainer-features src
          mkdir -p "$XDG_RUNTIME_DIR/podman"
          : > "$XDG_RUNTIME_DIR/podman/podman.sock"

      - name: Install latest devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Test ${{ matrix.feature }}
        run: devcontainer features test --project-folder . --skip-scenarios --skip-duplicated --base-image fedora:42 --remote-user root -f ${{ matrix.feature }}

  test-autogenerated-independent:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - podman-outside-of-podman
          - podman-in-podman
          - devcontainer-cli
          - opencode-server
          - opencode-tui
          - dotnet-aspire-cli
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      XDG_RUNTIME_DIR: /tmp/xdg
    steps:
      # actions/checkout@v5
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Prepare feature test layout
        run: |
          ln -sfn devcontainer-features src
          mkdir -p "$XDG_RUNTIME_DIR/podman"
          : > "$XDG_RUNTIME_DIR/podman/podman.sock"

      - name: Install latest devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Test ${{ matrix.feature }}
        run: devcontainer features test --project-folder . --skip-scenarios --skip-duplicated --base-image fedora:42 --remote-user root -f ${{ matrix.feature }}

  test-podman-in-podman-scenarios:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      XDG_RUNTIME_DIR: /tmp/xdg
    steps:
      # actions/checkout@v5
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Prepare feature test layout
        run: |
          ln -sfn devcontainer-features src
          mkdir -p "$XDG_RUNTIME_DIR/podman"
          : > "$XDG_RUNTIME_DIR/podman/podman.sock"

      - name: Install latest devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Test podman-in-podman 65532 scenario
        run: devcontainer features test --project-folder . --skip-autogenerated --skip-duplicated --base-image fedora:42 --remote-user root -f podman-in-podman --filter uid-65532
