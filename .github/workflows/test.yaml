name: CI - Test devcontainer features

on:
  push:
    branches:
      - main
    paths:
      - devcontainer-features/**
      - .github/workflows/test.yaml
  pull_request:
    paths:
      - devcontainer-features/**
      - .github/workflows/test.yaml
  workflow_dispatch:

jobs:
  test-scenarios:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      HOME_BREW_CI_BASE_IMAGE: feature-ci/homebrew-packages-base:latest
    strategy:
      matrix:
        features:
          - aspire-cli
          - homebrew-packages
          - nonroot-user
          - podman-in-podman
    steps:
      # actions/checkout@v5
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: "Install latest devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Build homebrew-packages CI base image"
        if: matrix.features == 'homebrew-packages'
        run: docker build --load --file devcontainer-features/test/homebrew-packages/feature-ci-base/Containerfile --tag "${HOME_BREW_CI_BASE_IMAGE}" .

      - name: "Generating tests for '${{ matrix.features }}' scenarios"
        run: |
          project_folder="devcontainer-features"
          base_image="registry.access.redhat.com/hi/core-runtime:latest-builder"
          if [ "${{ matrix.features }}" = "homebrew-packages" ]; then
            base_image="${HOME_BREW_CI_BASE_IMAGE}"
          fi
          devcontainer features test --project-folder "${project_folder}" --skip-autogenerated --skip-duplicated --base-image "${base_image}" --remote-user root -f ${{ matrix.features }}

      - name: "Smoke test podman-in-podman with devcontainer CLI"
        if: matrix.features == 'podman-in-podman'
        run: devcontainer-features/test/podman-in-podman/devcontainer-cli-smoke.sh

      - name: "Verify homebrew-packages rejects numeric-only users"
        if: matrix.features == 'homebrew-packages'
        run: devcontainer-features/test/homebrew-packages/requires-named-user.sh
