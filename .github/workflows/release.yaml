name: "Release dev container features"

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    steps:
      # actions/checkout@v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: "Prepare features for publish"
        run: |
          mkdir -p .scratch/publish
          rm -rf .scratch/publish/devcontainer-features
          cp -a devcontainer-features .scratch/publish/
          ./scripts/sync-homebrew-packages-additional.sh .scratch/publish/devcontainer-features/src/homebrew-packages .scratch/publish/devcontainer-features/src/homebrew-packages-additional

      - name: "Log in to GHCR"
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: "Build and publish core-runtime homebrew image"
        run: |
          docker build --file .scratch/publish/devcontainer-features/test/homebrew-install/feature-ci-base/Containerfile --tag ghcr.io/jonathan-tyler/containers/core-runtime:latest-homebrew .scratch/publish
          docker push ghcr.io/jonathan-tyler/containers/core-runtime:latest-homebrew

      - name: "Publish"
        # devcontainers/action@v1
        uses: devcontainers/action@1082abd5d2bf3a11abccba70eef98df068277772
        with:
          publish-features: "true"
          base-path-to-features: "./.scratch/publish/devcontainer-features/src"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
